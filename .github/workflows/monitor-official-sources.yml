name: Monitor official sources

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check official sources
        run: python scripts/monitor_sources.py

      - name: Create change report
        id: report
        run: |
          python - <<'PY'
          import json, os

          d = json.load(open('data/change-report.json'))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"changed={d['summary']['changed_sources']}\n")
              f.write(f"checked={d['summary']['sources_checked']}\n")
              f.write(f"failed={d['summary']['failed_sources']}\n")
          PY

      - name: Create GitHub Issue for changed sources
        if: steps.report.outputs.changed != '0'
        uses: actions/github-script@v9
        env:
          CHANGED_COUNT: ${{ steps.report.outputs.changed }}
        with:
          script: |
            const fs = require('fs');

            const report = JSON.parse(
              fs.readFileSync('data/change-report.json', 'utf8')
            );

            const changed = report.changed_sources || [];

            const urls = changed
              .map(x => `- ${x.url}`)
              .join('\n');

            const body = [
              '## ⚠️ Official source changes detected',
              '',
              `The Smart Benefit Finder monitor detected **${changed.length} changed official source(s)**.`,
              '',
              '### Changed sources',
              urls || '- No URLs listed',
              '',
              '### Important',
              'A detected page change does **not** automatically mean that eligibility rules changed.',
              '',
              'Review each official source manually before changing any eligibility rules in Smart Benefit Finder.',
              '',
              '### Recommended action',
              '1. Open each changed official source.',
              '2. Verify whether eligibility, benefits, deadlines, or requirements changed.',
              '3. Update the website database only if the official rules actually changed.',
              '4. Redeploy the website after the verified update.',
              '',
              `Monitor run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Smart Benefit Finder: Official sources changed',
              body: body
            });